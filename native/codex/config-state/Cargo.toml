[package]
name = "aimgr-codex-config-state"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "aimgr-codex-config-state"
path = "src/main.rs"

[[bin]]
name = "aimgr-codex-worktree"
path = "src/worktree.rs"

[dependencies]
codex-core = { path = "vendor/codex/codex-rs/core" }
codex-config = { path = "vendor/codex/codex-rs/config" }
codex-core-plugins = { path = "vendor/codex/codex-rs/core-plugins" }
codex-file-system = { path = "vendor/codex/codex-rs/file-system" }
codex-exec-server = { path = "vendor/codex/codex-rs/exec-server" }
codex-skills = { path = "vendor/codex/codex-rs/skills" }
codex-state = { path = "vendor/codex/codex-rs/state" }
codex-protocol = { path = "vendor/codex/codex-rs/protocol" }
codex-utils-absolute-path = { path = "vendor/codex/codex-rs/utils/absolute-path" }
codex-utils-cli = { path = "vendor/codex/codex-rs/utils/cli" }
codex-worktree = { path = "vendor/codex/codex-rs/worktree" }
libc = "0.2.182"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.9.5"
url = "2"
tempfile = "3"

[build-dependencies]
cc = "1"

[profile.dev]
debug = 0
strip = "symbols"

[profile.release]
debug = 0
strip = "symbols"
codegen-units = 4

[patch.crates-io]
# Uncomment to debug local changes.
# ratatui = { path = "../../ratatui" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
v8 = { git = "https://github.com/seanh-oai/rusty_v8.git", rev = "350c5a859a9b3c84ab8701b3ad51e3b7699b30c0" }

# Uncomment to debug local changes.
# rmcp = { path = "../../rust-sdk/crates/rmcp" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
