[package]
name = "aimgr-codex-config-state"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "aimgr-codex-config-state"
path = "src/main.rs"

[[bin]]
name = "aimgr-codex-worktree"
path = "src/worktree.rs"

[dependencies]
codex-core = { path = "vendor/codex/codex-rs/core" }
codex-config = { path = "vendor/codex/codex-rs/config" }
codex-core-plugins = { path = "vendor/codex/codex-rs/core-plugins" }
codex-file-system = { path = "vendor/codex/codex-rs/file-system" }
codex-exec-server = { path = "vendor/codex/codex-rs/exec-server" }
codex-skills = { path = "vendor/codex/codex-rs/skills" }
codex-state = { path = "vendor/codex/codex-rs/state" }
codex-protocol = { path = "vendor/codex/codex-rs/protocol" }
codex-utils-absolute-path = { path = "vendor/codex/codex-rs/utils/absolute-path" }
codex-utils-cli = { path = "vendor/codex/codex-rs/utils/cli" }
codex-utils-path = { path = "vendor/codex/codex-rs/utils/path-utils" }
codex-worktree = { path = "vendor/codex/codex-rs/worktree" }
codex-rollout = { path = "vendor/codex/codex-rs/rollout" }
codex-thread-store = { path = "vendor/codex/codex-rs/thread-store" }
codex-rmcp-client = { path = "vendor/codex/codex-rs/rmcp-client" }
chrono = "0.4"
tracing = "0.1"
libc = "0.2.182"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.9.5"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
color-eyre = "0.6"

[build-dependencies]
cc = "1"

[profile.dev]
debug = 0
strip = "symbols"

[profile.release]
debug = 0
strip = "symbols"
codegen-units = 4

[patch.crates-io]
# Uncomment to debug local changes.
# ratatui = { path = "../../ratatui" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
sqlx-core = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "7447c427513cfe685f236e1ac0513c4ea3dd9c0b" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }
v8 = { git = "https://github.com/openai-oss-forks/rusty_v8.git", rev = "90a65f887a0c0f048f3784afbcb320b373c8a2e0" }

# Uncomment to debug local changes.
# rmcp = { path = "../../rust-sdk/crates/rmcp" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }
